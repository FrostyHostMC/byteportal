<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sound board</title>
    <style>
      :root { color-scheme: dark; --bg: #16181d; --panel: #1f232b; --line: #2e3440; --text: #e6e8ec; --dim: #9aa3b2; --accent: #ffcf4a; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
      header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
      h1 { font-size: 16px; margin: 0 8px 0 0; }
      label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
      select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.on { background: var(--accent); color: #111; border-color: var(--accent); }
      main { padding: 8px 16px 40px; max-width: 1100px; }
      section { margin-top: 18px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin: 0 0 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      .note { color: var(--dim); font-size: 12px; margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Sound board</h1>
      <label>Version <select id="bank"></select></label>
      <label>Distance <select id="dist"><option value="0">here</option><option value="8">8 blocks</option><option value="25">25 blocks</option><option value="60">60 blocks</option><option value="100">100 blocks</option></select></label>
      <label>Side <select id="side"><option value="0">ahead</option><option value="-1">left</option><option value="1">right</option></select></label>
    </header>
    <main id="main"></main>
    <script type="module" src="./sounds.ts"></script>
  </body>
</html>
