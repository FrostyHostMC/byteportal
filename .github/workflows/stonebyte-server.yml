# Builds the game server's image (Dockerfile.stonebyte) and publishes it to GitHub's registry,
# where your host (Render) runs it. Free for a public repository.
name: Stonebyte server image
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['src/**', 'engine/**', 'Dockerfile.stonebyte', 'package.json', 'package-lock.json']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase the owner (the registry needs it)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.stonebyte
          push: true
          tags: ghcr.io/${{ env.OWNER }}/stonebyte-server:latest
