# Builds the website and publishes it on GitHub Pages (free). Needs: the repository named
# <your-username>.github.io, and a repository variable GAME_SERVER (see STONEBYTE-SETUP.md).
name: Stonebyte site
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/workflows/stonebyte-server.yml', 'Dockerfile*']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - run: npm ci
      - run: npm run wasm
      - run: npx vite build
        env:
          VITE_GAME_SERVER: ${{ vars.GAME_SERVER }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
